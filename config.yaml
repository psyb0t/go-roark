package: roark
generate:
  client: true
  models: true
output: client.gen.go
output-options:
  resolve-type-name-collisions: true
  # Top-level webhook unions refer to models the path-based pruner drops.
  skip-prune: true
  # Unformatted numbers include metrics and usage. Keep float64 precision
  # instead of oapi-codegen's float32 default.
  type-mapping:
    number:
      default:
        type: float64
compatibility:
  always-prefix-enum-values: true
