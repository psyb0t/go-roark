title = "go-roark secret scanning"

[extend]
useDefault = true

# gitleaks' `dir` mode walks the working tree and does NOT honour .gitignore, so
# every gitignored local path is named again here. Nothing gitignored is tracked
# by git. The committed Go vendor/ tree is intentionally NOT listed: it ships to
# consumers, so it gets scanned. Verify with `git check-ignore <path>` before
# adding a line; an entry for a committed source path silences real leaks.
[[allowlists]]
description = "Gitignored local scratch, downloaded specs, caches, and scan artifacts"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.vscode(?:/|$)''',
  '''(^|/)\.telemetry(?:/|$)''',
  '''(^|/)\.research_files(?:/|$)''',
  '''(^|/)\.testing(?:/|$)''',
  '''(^|/)api/openapi(?:\.fixed)?\.json$''',
  '''(^|/)__pycache__(?:/|$)''',
  '''(^|/)sec\.sarif$''',
  '''(^|/)git-update\.sh(?:\.debot)?$''',
  '''(^|/)CLAUDE\.md$''',
]

# Roark publishes this dummy key in CreateMyApiKeyResponse.example. The
# generator repeats that example in comments. Match only that exact value
# and only the generated client; every other value and file stays scanned.
[[allowlists]]
description = "Published Roark spec example in generated comments"
condition = "AND"
paths = ['''(^|/)client\.gen\.go$''']
regexTarget = "secret"
regexes = ['''^roark0f1e2d3c4b5a69788796a5b4c3d2e1f09182$''']
